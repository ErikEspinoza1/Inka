name: inka
description: MVP App de Tatuajes con AR
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5
  permission_handler: ^11.0.0
  google_mlkit_pose_detection: ^0.10.0
  supabase_flutter: ^2.12.0
  firebase_core: ^3.10.1
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^18.0.1
  image_picker: ^1.2.1
  http: ^1.6.0
  shared_preferences: ^2.5.5
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geocoding: ^3.0.0
  geolocator: ^13.0.0
  flutter_dotenv: ^6.0.0
  carousel_slider: ^5.0.0
  google_fonts: ^8.1.0
  flutter_staggered_grid_view: ^0.7.0
  share_plus: ^13.1.0
  add_2_calendar: ^3.0.1
  flutter_native_splash: ^2.4.0
  image: ^4.8.0
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  gal: ^2.3.0
  url_launcher: ^6.3.2
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/inka_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#050505"
  image: "assets/images/inka_icon.png"
  android: true
  ios: true
  fullscreen: true
  
  android_12:
    color: "#050505"
    image: "assets/images/inka_icon.png"

flutter:
  uses-material-design: true

  
  assets:
    - assets/images/
    - assets/images/inka_icon.png
    - assets/images/inka_logo.png
    - .env